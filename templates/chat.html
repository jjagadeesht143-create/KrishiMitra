{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block content %}
<h1>Chat with KrishiMitra</h1>
<p class="lede">Give your farmer ID once, then ask anything about your crop.</p>
<form id="chat-form" class="form">
  <label>Farmer ID (required)
    <input name="farmer_id" inputmode="numeric" required />
  </label>
  <label>Your message (required)
    <textarea name="message" rows="3" maxlength="2000" required></textarea>
  </label>
  <button type="submit" data-i18n="send">Send</button>
</form>
<p class="loading" data-loading hidden>Loading…</p>
<p class="error" data-error hidden></p>
<div class="result" data-result hidden></div>
{% endblock %}
